[pytest]
# Pytest configuration for HireUs Backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test settings
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test paths
testpaths = app/tests

# Coverage settings
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=0

# Markers for categorizing tests
markers =
    unit: Unit tests (pure functions, no external dependencies)
    integration: Integration tests (database, API calls)
    slow: Slow running tests
    security: Security related tests
    calculations: Calculation/algorithm tests
    utils: Utility function tests
    roles: Roles module tests
    workflows: Workflows module tests
    interview_kits: Interview kits module tests
